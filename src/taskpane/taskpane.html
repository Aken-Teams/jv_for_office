<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JVision for Excel</title>
  <!-- Office.js must come from Microsoft's CDN — it is version-matched to the host
       at runtime and cannot be self-hosted reliably. It is a classic script, so it
       finishes executing before the deferred module below calls Office.onReady. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="./taskpane.css" />
</head>
<body>

  <!-- Icon defs. Inline SVG rather than emoji or an icon font: emoji render
       differently per platform and can't inherit colour, and a font is one more
       request for six glyphs. Referenced with <use href="#i-name">. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-sheet">
        <rect x="2.5" y="3.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M2.5 7h13M7 7v7.5" stroke="currentColor" stroke-width="1.3"/>
      </g>
      <g id="i-undo">
        <path d="M7 4.5L3.5 8 7 11.5M3.5 8h7.25a4.25 4.25 0 110 8.5H7"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="i-signout">
        <path d="M12 5.5V4a1.5 1.5 0 00-1.5-1.5h-6A1.5 1.5 0 003 4v12a1.5 1.5 0 001.5 1.5h6A1.5 1.5 0 0012 16v-1.5M8 10h9m0 0l-3-3m3 3l-3 3"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="i-send">
        <path d="M10 16V4.5M10 4.5L5 9.5M10 4.5l5 5"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="i-link">
        <path d="M8.5 11.5a3.2 3.2 0 004.6 0l2.4-2.4a3.25 3.25 0 10-4.6-4.6l-1 1"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M11.5 8.5a3.2 3.2 0 00-4.6 0l-2.4 2.4a3.25 3.25 0 104.6 4.6l1-1"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g id="i-shield">
        <path d="M10 2.6l6 2.2v4.6c0 3.5-2.4 6.4-6 7.9-3.6-1.5-6-4.4-6-7.9V4.8l6-2.2z"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M7.4 9.9l1.9 1.9 3.4-3.6" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="i-globe">
        <circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.35"/>
        <path d="M2.9 10h14.2M10 2.8c1.9 2 2.9 4.5 2.9 7.2s-1 5.2-2.9 7.2c-1.9-2-2.9-4.5-2.9-7.2s1-5.2 2.9-7.2z"
              fill="none" stroke="currentColor" stroke-width="1.35"/>
      </g>
      <g id="i-mail">
        <rect x="2.6" y="4.8" width="14.8" height="10.4" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35"/>
        <path d="M3.2 6l6.8 4.6L16.8 6" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
      </g>
      <g id="i-book">
        <path d="M4 4.4h5a2 2 0 012 2v9a1.6 1.6 0 00-1.6-1.6H4z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M16 4.4h-5a2 2 0 00-2 2v9a1.6 1.6 0 011.6-1.6H16z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      </g>
      <g id="i-plus">
        <path d="M10 4.6v10.8M4.6 10h10.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </g>
      <g id="i-check">
        <path d="M4.5 10.4l3.6 3.6 7.4-8" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="i-stop">
        <rect x="6" y="6" width="8" height="8" rx="1.6" fill="currentColor"/>
      </g>
      <g id="i-select">
        <rect x="3" y="4.5" width="14" height="11" rx="1.5" fill="none" stroke="currentColor"
              stroke-width="1.3" stroke-dasharray="2.6 2"/>
        <rect x="6.2" y="7.6" width="7.6" height="4.8" rx="1" fill="currentColor" opacity=".85"/>
      </g>
      <g id="i-ask">
        <circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7.9 8.1a2.15 2.15 0 114.1.95c-.35.7-1.05 1-1.5 1.45-.35.35-.5.7-.5 1.2"
              fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/>
        <circle cx="10" cy="14.2" r=".95" fill="currentColor"/>
      </g>
      <g id="i-warn">
        <path d="M10 3.2L18 16.8H2L10 3.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10 8v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="10" cy="14.2" r=".95" fill="currentColor"/>
      </g>
    </defs>
  </svg>

  <!-- ── Login ── -->
  <section id="login" class="pane">
    <div class="login-inner">
      <div class="brand brand-lg">
        <img class="brand-mark brand-mark-lg" src="../../assets/logo.png" alt="JVision" />
        <div>
          <div class="brand-name">JVision</div>
          <div class="brand-sub">for Excel</div>
        </div>
      </div>
      <p class="lead">登入你的 AI Agents Office 帳號，開始對這份活頁簿提問。</p>

      <!-- Which tabs appear depends on GET /api/auth/mode. In pro-panjit the AD
           tab is the default, because email/password is whitelist-only there and
           would just reject everyone with "帳號或密碼錯誤". -->
      <div id="login-tabs" class="tabs" role="tablist" hidden>
        <button type="button" class="tab" data-mode="ad" role="tab">AD 帳號</button>
        <button type="button" class="tab" data-mode="email" role="tab">電子信箱</button>
      </div>

      <form id="login-form" novalidate>
        <!-- Deployment configuration, not a user preference: the address comes
             from config.json (generated from .env). Revealed only when the
             configured server can't be reached, so a wrong address is
             self-serviceable without making everyone else read it. -->
        <label id="api-base-field" hidden>伺服器
          <input id="api-base" type="text" placeholder="http://localhost:12054" autocomplete="off" spellcheck="false" />
        </label>

        <!-- 組織 first, matching the web login: you pick who you are before you
             say which account. Options are filled in from AD_DOMAINS in app.js. -->
        <div id="fields-ad" hidden>
          <label>組織
            <select id="ad-domain"></select>
          </label>
          <label>工號
            <input id="ad-username" type="text" autocomplete="username" spellcheck="false" />
          </label>
          <label>密碼
            <input id="ad-password" type="password" autocomplete="current-password" />
          </label>
        </div>

        <div id="fields-email" hidden>
          <label>電子信箱
            <input id="email" type="email" autocomplete="username" spellcheck="false" />
          </label>
          <label>密碼
            <input id="password" type="password" autocomplete="current-password" />
          </label>
        </div>

        <button type="submit" class="btn-primary">登入</button>
        <div id="login-error" class="err-text" role="alert"></div>
      </form>
    </div>
  </section>

  <!-- ── Chat ── -->
  <section id="chat" class="pane">
    <header>
      <div class="brand">
        <img class="brand-mark" src="../../assets/logo.png" alt="" />
        <span class="brand-name">JVision</span>
      </div>
      <div class="actions">
        <!-- Whether writes need a click. Lives in the header rather than the
             workbook bar because it must be visible at all times: when it is on,
             nothing else stands between an instruction hidden in a downloaded
             workbook and this spreadsheet. Label and colour both change. -->
        <button id="approve-mode" class="icon-btn" aria-pressed="false">
          <svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-shield"/></svg>
        </button>
        <button id="undo" class="icon-btn" disabled data-tip="復原上一步 AI 做的修改" aria-label="復原上一步">
          <svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-undo"/></svg>
          <span id="undo-count" class="badge" hidden></span>
        </button>
        <button id="logout" class="icon-btn" data-tip="登出" aria-label="登出">
          <svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-signout"/></svg>
        </button>
      </div>
    </header>

    <div class="wb-bar">
      <svg class="ic ic-sm" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-sheet"/></svg>
      <span id="wb-name" title="目前開啟的活頁簿"></span>
      <!-- Which sheet the agent is actually looking at. flex:none so the workbook
           name is what gets truncated in a 350px bar, never this — with sheets
           called 工作表1 / 工作表5 / 缺料警示 the sheet is the part that tells you
           anything. -->
      <span id="wb-sheet" hidden></span>
    </div>


    <div id="log">
      <div id="empty" class="empty">
        <img class="brand-mark brand-mark-xl" src="../../assets/logo.png" alt="" />
        <p class="empty-title">問這份活頁簿任何事</p>
        <p class="empty-sub">我讀得到儲存格、公式和你選取的範圍，也能在你確認後寫回去。</p>
        <div class="chips">
          <button type="button" class="chip">這張表在算什麼？</button>
          <button type="button" class="chip">幫我找出所有錯誤的公式</button>
          <button type="button" class="chip">選取範圍幫我做一張摘要</button>
          <button type="button" class="chip">這些數字有什麼趨勢？</button>
        </div>
      </div>
    </div>

    <!-- What the user has selected in Excel right now, carried with the next
         message. Above the input rather than in the workbook bar: it is part of
         what you are about to send, not a property of the session. -->
    <div id="sel-chip" class="sel-chip" hidden>
      <svg class="ic ic-sm" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-select"/></svg>
      <span id="sel-label"></span>
      <button type="button" id="sel-drop" class="sel-drop" aria-label="這則訊息不要帶選取範圍">×</button>
    </div>
    <form id="composer">
      <!-- Opens upward: the composer is pinned to the bottom of the pane, so a
           menu below it would be off-screen. Moved out of the workbook bar,
           which now has to fit both the workbook and the worksheet name. -->
      <div id="src-menu" class="src-menu" hidden role="menu" aria-labelledby="plus">
        <button type="button" class="src-item" data-src="web" role="menuitemcheckbox" aria-checked="false">
          <svg class="ic ic-sm" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-globe"/></svg>
          <span class="src-name">搜尋網路</span>
          <svg class="ic ic-sm src-tick" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-check"/></svg>
        </button>
        <button type="button" class="src-item" data-src="email" role="menuitemcheckbox" aria-checked="false">
          <svg class="ic ic-sm" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-mail"/></svg>
          <span class="src-name">郵件</span>
          <svg class="ic ic-sm src-tick" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-check"/></svg>
        </button>
        <button type="button" class="src-item" data-src="km" role="menuitemcheckbox" aria-checked="false">
          <svg class="ic ic-sm" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-book"/></svg>
          <span class="src-name">KM 文件</span>
          <svg class="ic ic-sm src-tick" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-check"/></svg>
        </button>
        <div id="src-note" class="src-note">開啟後，這個對話可以讀取這些來源（唯讀）。</div>
      </div>

      <div class="input-shell">
        <button type="button" id="plus" class="plus-btn" aria-haspopup="true" aria-expanded="false"
                aria-label="外部資料來源">
          <svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="對這份活頁簿提問…" aria-label="訊息"></textarea>
        <button id="send" type="submit" class="send-btn" disabled title="送出（Enter）" aria-label="送出">
          <svg id="send-ic" class="ic" viewBox="0 0 20 20" aria-hidden="true"><use href="#i-send"/></svg>
        </button>
      </div>
      <div class="hint-row">Enter 送出 · Shift+Enter 換行</div>
    </form>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
